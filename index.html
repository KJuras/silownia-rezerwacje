<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siłownia - Rezerwacje</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="login-container"> <!-- Główny kontener formularza logowania, który zostanie wyśrodkowany na ekranie przez Flexbox -->
        <h1>Logowanie do siłowni</h1>
        
        <form id="loginForm"> <!-- Formularz z odpowiednim identyfikatorem (id), co pozwoli nam później na łatwe "chwycenie" go w JavaScript -->
            <div class="form-group"> <!-- Grupowanie elementów formularza dla łatwiejszego zarządzania odstępami -->
                <label for="email">Adres e-mail:</label>
                <input type="email" id="email" name="email" required> <!-- Zastosowanie type="email" zapewnia natywną, wstępną walidację przeglądarki -->
            </div>
            
            <div class="form-group">
                <label for="password">Hasło:</label>
                <input type="password" id="password" name="password" required>
            </div>
    
            <button type="submit">Zaloguj się</button>            <!-- Przycisk typu "submit" automatycznie triggeruje wysłanie formularza -->
        </form>
        
        <p>Nie masz konta? <a href="#">Zarejestruj się</a></p>        <!-- Link kierujący do widoku rejestracji -->
    </div>

    <script src="js/script.js"></script>
</body>
</html>
