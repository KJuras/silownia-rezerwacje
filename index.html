<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siłownia - Rezerwacje</title>
    <!-- Podłączenie arkusza stylów -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>Logowanie do siłowni</h1>
        
        <!-- Formularz z wyłączoną natywną walidacją przeglądarki (novalidate) -->
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Adres e-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Hasło:</label>
                <input type="password" id="password" name="password" required>
            </div>
    
            <button type="submit">Zaloguj się</button>            
            <!-- Kontener na komunikaty wstrzykiwane z JavaScript -->
            <div id="message-box" class="message-box"></div>
        </form>
        
        <p>Nie masz konta? <a href="#">Zarejestruj się</a></p>
    </div>

    <!-- Podłączenie skryptu JS przed zamknięciem tagu body -->
    <script src="js/script.js"></script>
</body>
</html>
